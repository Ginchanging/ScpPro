[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scppro"
version = "1.0.0"
description = "A macOS desktop SFTP file transfer app"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PySide6==6.11.2",
    "paramiko==5.0.0",
    "keyring==25.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt==4.5.0"]
build = ["pyinstaller==6.22.3"]

[project.scripts]
scppro = "scppro.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scppro = ["resources/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"
